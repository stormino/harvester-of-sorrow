services:
  harvester-of-sorrow:
    # Use pre-built image from GitHub Container Registry
    # image: ghcr.io/stormino/harvester-of-sorrow:latest
    # Or build locally
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: harvester-of-sorrow
    ports:
      - "8080:8080"
    environment:
      # Required
      - TMDB_API_KEY=${TMDB_API_KEY:?TMDB_API_KEY is required}
      # Optional - Download settings
      - DOWNLOAD_MOVIES_PATH=/downloads/movies
      - DOWNLOAD_TV_SHOWS_PATH=/downloads/tvshows
      - DOWNLOAD_TEMP_PATH=/downloads/temp
      - PARALLEL_DOWNLOADS=${PARALLEL_DOWNLOADS:-3}
      - SEGMENT_CONCURRENCY=${SEGMENT_CONCURRENCY:-5}
      - DEFAULT_QUALITY=${DEFAULT_QUALITY:-best}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      # Optional - JVM settings
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
      # Optional - Library monitoring
      - MONITORING_ENABLED=${MONITORING_ENABLED:-true}
      - MONITORING_CRON=${MONITORING_CRON:-0 0 3,6 * * *}
      # Optional - Daily check of watchlist titles no source had yet
      - WATCHLIST_CHECK_ENABLED=${WATCHLIST_CHECK_ENABLED:-true}
      - WATCHLIST_CHECK_CRON=${WATCHLIST_CHECK_CRON:-0 0 7 * * *}
      # Optional - RaiPlay (enabled only when both are set)
      - RAIPLAY_USERNAME=${RAIPLAY_USERNAME:-}
      - RAIPLAY_PASSWORD=${RAIPLAY_PASSWORD:-}
      # Optional - registered IRC nick for XDCC channels that need one (usually set in Settings > IRC Account)
      - XDCC_IRC_NICK=${XDCC_IRC_NICK:-}
      - XDCC_IRC_PASSWORD=${XDCC_IRC_PASSWORD:-}
      - XDCC_IRC_EMAIL=${XDCC_IRC_EMAIL:-}
      - XDCC_IRC_AUTO_REGISTER=${XDCC_IRC_AUTO_REGISTER:-false}
      # Optional - Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ${DOWNLOAD_PATH:-./downloads}:/downloads
      # Database. Upgrading from 3.x: see docs/UPGRADING.md (vixsrc-data -> hos-data)
      - hos-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hos-data:
